
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: support direct navigation to frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward GraphQL requests to the backend container
    location /graphql {
        proxy_pass http://backend:4000/graphql;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward health checks to the backend
    location /health {
        proxy_pass http://backend:4000/health;
        proxy_set_header Host $host;
    }
}
